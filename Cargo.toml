[package]
name = "whence"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local search engine and time machine for your coding agents' transcripts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ethan/whence"
keywords = ["claude-code", "codex", "search", "transcript", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
libc = "0.2.189"
ratatui = "0.30.2"
rayon = "1"
regex = "1.13.1"
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-io", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26"
tantivy-jieba = "0.20.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }
unicode-width = "0.2.2"
walkdir = "2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
